services:
  app:
    build: .
    container_name: backend
    environment:
      - PORT=8080
    expose:
      - "8080"
    volumes:
      - app_logs:/app/logs
    networks:
      - monitoring
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/monitoring/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring:/etc/monitoring:ro
    expose:
      - "9090"
    networks:
      - monitoring

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/monitoring/loki.yml
    volumes:
      - loki_data:/loki
      - ./monitoring:/etc/monitoring:ro
    expose:
      - "3100"
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    command: -config.file=/etc/monitoring/promtail.yml
    volumes:
      - app_logs:/app/logs
      - promtail_data:/tmp
      - ./monitoring:/etc/monitoring:ro
    depends_on:
      - loki
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  promtail_data:
  app_logs:

networks:
  monitoring: